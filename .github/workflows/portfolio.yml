name: Traffic forecasting tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-forecasting.txt
      - run: python -m unittest discover -s tests/portfolio -v
      - run: python -m unittest discover -s tests/forecasting -v
      - run: python -m traffic_analysis --output /tmp/traffic-demo --repeats 2
      - run: python -m traffic_forecasting.inference --artifact artifacts/forecasting/gru_mean_1.joblib --family gru --request docs/forecasting/example_request.json
